<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — StrategyVault</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="login" class="login"><div class="login-card"><div class="mark">S</div><span class="eyebrow">SECURE ADMIN</span><h1>Control center</h1><p>Sign in to manage strategies, media, notes and profile information.</p><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Unlock dashboard →</button><div id="err"></div></div></div>
<div id="dash" class="hidden"><header><div class="brand"><div class="mark">S</div><div><b>Admin Console</b><small>StrategyVault</small></div></div><nav><a href="/">View site</a><button class="admin" onclick="logout()">Logout</button></nav></header><main class="dashboard">
<div class="dash-top"><div><span class="eyebrow">CONTROL CENTER</span><h1>Manage your vault.</h1></div><button onclick="newStrategy()">+ New strategy</button></div>
<div class="tabs"><button class="active" onclick="tab('strategies',this)">Strategies</button><button onclick="tab('notes',this)">Notes</button><button onclick="tab('profile',this)">Profile & Contact</button></div>
<section id="strategiesTab"><div id="adminStrategies" class="admin-list"></div></section>
<section id="notesTab" class="hidden"><div class="editor"><input id="noteTitle" placeholder="Note title"><textarea id="noteContent" placeholder="Write your private note..."></textarea><button onclick="saveNote()">Save note</button></div><div id="notesList" class="admin-list"></div></section>
<section id="profileTab" class="hidden"><div class="editor"><input id="pName" placeholder="Name"><textarea id="pBio" placeholder="About yourself"></textarea><input id="pEmail" placeholder="Email"><input id="pTelegram" placeholder="Telegram URL"><input id="pFacebook" placeholder="Facebook URL"><input id="pAvatar" placeholder="Avatar image URL (optional)"><button onclick="saveProfile()">Save profile</button></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="x" onclick="closeModal()">×</button><span class="eyebrow">STRATEGY EDITOR</span><h2 id="modalTitle">New strategy</h2><input id="sTitle" placeholder="Strategy name"><input id="sCategory" placeholder="Category (e.g. Price Action)"><textarea id="sDescription" placeholder="Short description"></textarea><textarea id="sContent" placeholder="Full strategy, rules, entry, exit, risk management..."></textarea><input id="sImage" placeholder="Image URL (or upload below)"><input id="sVideo" placeholder="Video URL (MP4/WebM or YouTube embed URL)"><label class="upload">Upload image/video <input id="media" type="file" accept="image/*,video/*" onchange="uploadMedia()"></label><button onclick="saveStrategy()">Save strategy</button></div></div>
<script src="/admin.js"></script></body></html>
